# Triggers the 4:30 PM PST auto clock-out even if the Render server is asleep.
#
# Setup (GitHub repo -> Settings -> Secrets and variables -> Actions):
#   TIMECLOCK_URL  e.g. https://powerhouze-clock.onrender.com  (no trailing slash)
#   CRON_SECRET    same value as the CRON_SECRET env var on Render
#
# GitHub cron is UTC and ignores daylight saving, so it runs at both 23:30 and
# 00:30 UTC. The server ignores the call that lands before 4:30 PM PST and the
# second call is a no-op because nobody is left clocked in.
name: Auto clock-out

on:
  schedule:
    - cron: '30 23 * * *'
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  auto-clockout:
    runs-on: ubuntu-latest
    steps:
      - name: Call auto clock-out endpoint
        env:
          TIMECLOCK_URL: ${{ secrets.TIMECLOCK_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # Free Render services can take ~1 minute to wake up, so allow retries
          curl --fail-with-body --silent --show-error \
            --retry 5 --retry-delay 20 --retry-all-errors --max-time 120 \
            -X POST "$TIMECLOCK_URL/cron/auto-clockout" \
            -H "x-cron-secret: $CRON_SECRET"
